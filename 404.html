    </div><main><section class="hero"><p class="kicker">ERREUR 404</p><h1>Cette page<br><span id="seasonal-message">n'existe pas</span>.</h1><a class="button" href="index.html">Retour à l'accueil ↗</a></section></main><script src="assets/js/main.js" defer></script>
<script>
(() => {
    const messageElement = document.getElementById("seasonal-message");
    if (!messageElement) return;

    // Calcule la date de Pâques pour l'année indiquée (calendrier grégorien).
    function getEasterDate(year) {
        const a = year % 19;
        const b = Math.floor(year / 100);
        const c = year % 100;
        const d = Math.floor(b / 4);
        const e = b % 4;
        const f = Math.floor((b + 8) / 25);
        const g = Math.floor((b - f + 1) / 3);
        const h = (19 * a + b - d - g + 15) % 30;
        const i = Math.floor(c / 4);
        const k = c % 4;
        const l = (32 + 2 * e + 2 * i - h - k) % 7;
        const m = Math.floor((a + 11 * h + 22 * l) / 451);
        const month = Math.floor((h + l - 7 * m + 114) / 31);
        const day = ((h + l - 7 * m + 114) % 31) + 1;
        return new Date(year, month - 1, day);
    }

    function addDays(date, days) {
        const result = new Date(date);
        result.setDate(result.getDate() + days);
        return result;
    }

    function isBetween(date, start, end) {
        return date >= start && date <= end;
    }

    const now = new Date();
    const year = now.getFullYear();
    const date = new Date(year, now.getMonth(), now.getDate());
    const easter = getEasterDate(year);

    const easterStart = addDays(easter, -14);
    const easterEnd = addDays(easter, 14);

    let message = "n'existe pas";

    // Le 1er avril est prioritaire sur toutes les autres périodes.
    if (now.getMonth() === 3 && now.getDate() === 1) {
        message = "va te rediriger ver une page secrète, non c'est une blague.";
    } else if (isBetween(date, easterStart, easterEnd)) {
        message = "est allée à la chasse aux oeufs";
    } else if (now.getMonth() === 6 || now.getMonth() === 7) {
        // Vacances d'été : juillet et août.
        message = "est  allée à la plage";
    } else if (now.getMonth() === 8) {
        // Été / rentrée scolaire : septembre.
        message = "est à l'école";
    } else if (now.getMonth() === 9 && now.getDate() === 31) {
        message = "est allée chercher des cyberbonbons";
    } else if (now.getMonth() === 9) {
        message = "est allée cueillir des champignons";
    } else if (now.getMonth() === 10) {
        message = "se balade en forêt";
    } else if (now.getMonth() === 11 && now.getDate() === 25) {
        message = "ouvre ses cadeaux";
    } else if (now.getMonth() === 11 && now.getDate() < 25) {
        message = "fait un bonhomme de neige";
    } else if (now.getMonth() === 11 || now.getMonth() <= 1) {
        // Après Noël : du 26 décembre à la fin février.
        message = "est allée faire de la luge";
    } else if (date < easterStart) {
        message = "cueille des fleurs";
    } else {
        message = "se promène  dans les champs";
    }

    messageElement.textContent = message;
})();
</script>
